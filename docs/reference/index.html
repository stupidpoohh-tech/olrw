<!DOCTYPE html>
<!-- 이 파일은 옛 구현의 **디자인 레퍼런스**다. 동작하는 앱이 아니다.
     파이어베이스 설정값은 자리표("…")로 비워 두었다 — 공개 저장소에 실사용
     프로젝트를 특정할 값을 두지 않는다. 새 앱은 Neon 을 쓴다 (D14). -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OLRW — Our love, rightly written</title>
  <link rel="stylesheet" href="styles.css" />

  <!--
    Firebase backend — real-time sync between two devices via Email/Password Auth + Firestore.
    To finish setup: open Firebase console for project `<옛 파이어베이스 프로젝트>` and
      1. Authentication → Sign-in method → Enable "Email/Password"
      2. Firestore → Create database (location: asia-northeast3 / Seoul)
      3. Paste the security rules from DEPLOY.md
      4. After deploying, add your Pages domain to Authentication → Settings → Authorized domains
    See DEPLOY.md for the full step-by-step.
  -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    window.FIREBASE_CONFIG = {
      apiKey: "…",
      authDomain: "…",
      projectId: "…",
      storageBucket: "…",
      messagingSenderId: "…",
      appId: "…"
    };
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <!-- Shared color palettes (must load before store.jsx) -->
