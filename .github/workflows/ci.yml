name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RLS · 서버 함수 검증. Neon 프로젝트도 Docker 도 필요 없다.
      - run: neon/tests/run.sh
      - run: neon/tests/concurrency_test.sh
